name: Bug report
description: Report a problem with Companion Desk.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Companion Desk. Remove tokens, account details, private SSH details, and personal paths from screenshots or logs."
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10 x64
        - Windows 11 x64
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Companion Desk version
      placeholder: "Example: v0.5.1-beta"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: "Describe the problem and what you expected instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. ...\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: "Attach screenshots or logs if helpful. Remove tokens, account IDs, email addresses, and other private data first."
