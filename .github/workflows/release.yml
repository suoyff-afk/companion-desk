name: Windows Beta Release

on:
  push:
    tags:
      - "v*.*.*-beta*"

permissions:
  contents: read

env:
  VITE_ENABLE_FRIENDS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$RELEASE_TAG"
      - run: npm ci
      - name: Gate public release history
        env:
          RELEASE_HISTORY_DENY_TERMS: ${{ secrets.RELEASE_HISTORY_DENY_TERMS }}
        run: npm run release:history:gate -- --all-refs --require-deny-terms
      - name: Verify asset redistribution authorization
        run: npm run release:assets:gate
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  build:
    runs-on: windows-latest
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Configure reproducible Rust paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $cargoHome = if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
            [System.IO.Path]::GetFullPath((Join-Path $env:USERPROFILE ".cargo"))
          } else {
            [System.IO.Path]::GetFullPath($env:CARGO_HOME)
          }
          $rustupHome = if ([string]::IsNullOrWhiteSpace($env:RUSTUP_HOME)) {
            [System.IO.Path]::GetFullPath((Join-Path $env:USERPROFILE ".rustup"))
          } else {
            [System.IO.Path]::GetFullPath($env:RUSTUP_HOME)
          }
          $remaps = @(
            "--remap-path-prefix=$workspace=/workspace"
            "--remap-path-prefix=$cargoHome=/cargo-home"
            "--remap-path-prefix=$rustupHome=/rustup-home"
          )
          $rustflags = (@($env:RUSTFLAGS) + $remaps |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) -join " "
          "RUSTFLAGS=$rustflags" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Tauri
        shell: pwsh
        run: npm run tauri -- build

      - name: Scan Rust binary for local build paths
        env:
          BINARY_PATH: src-tauri/target/release/kunkun-desk.exe
        shell: pwsh
        run: node scripts/scan-binary-paths.mjs "$env:BINARY_PATH"

      - name: Prepare unsigned Windows release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.Substring(1)

          $nsis = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $msi = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)
          if ($nsis.Count -ne 1) {
            throw "Expected exactly one NSIS EXE, found $($nsis.Count)."
          }
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)."
          }

          $artifactDir = New-Item -ItemType Directory -Path "artifacts" -Force
          $exeTarget = Join-Path $artifactDir "Companion-Desk_$version_windows-x64-setup.exe"
          $msiTarget = Join-Path $artifactDir "Companion-Desk_$version_windows-x64.msi"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination $exeTarget
          Copy-Item -LiteralPath $msi[0].FullName -Destination $msiTarget

          $checksumLines = foreach ($asset in @($exeTarget, $msiTarget)) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $asset)"
          }
          $checksumPath = Join-Path $artifactDir "SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines(
            $checksumPath,
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - uses: actions/upload-artifact@v4
        with:
          name: companion-desk-windows-x64-unsigned
          path: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs:
      - verify
      - build
    if: ${{ needs.verify.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-desk-windows-x64-unsigned
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: true
          prerelease: true
          generate_release_notes: true
